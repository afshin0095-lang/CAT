name: CAT Rust Diagnostic

on:
  push:
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '.github/workflows/rust-diagnostic.yml'
  pull_request:
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '.github/workflows/rust-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnostic:
    name: Diagnostic compiler output
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Expose rustfmt diff
        shell: bash
        run: |
          cargo fmt --all
          if ! git diff --quiet; then
            while IFS= read -r line; do
              [ -n "$line" ] && echo "::error title=rustfmt::$line"
            done < <(git diff --no-color | head -120)
          fi
      - name: Compile affected packages and expose errors
        shell: bash
        run: |
          set +e
          packages=(cat-eventstore-postgres cat-decision cat-affiliate cat-content cat-orchestrator cat-platform cat-prompt)
          overall=0
          for package in "${packages[@]}"; do
            echo "=== CHECK $package ==="
            cargo check -p "$package" --all-targets 2>&1 | tee "/tmp/$package.check.log"
            status=${PIPESTATUS[0]}
            if [ "$status" -ne 0 ]; then
              overall=1
              summary=$(tail -n 30 "/tmp/$package.check.log" | tr '\n' ' ' | tr '\r' ' ')
              echo "::error title=$package check status::$summary"
              sed -E 's/\x1B\[[0-9;]*[[:alpha:]]//g' "/tmp/$package.check.log" > "/tmp/$package.check.clean.log"
              while IFS= read -r line; do
                [ -n "$line" ] && echo "::error title=$package check::$line"
              done < <(grep -E '^(error(\[[A-Z0-9]+\])?:|[[:space:]]*--> |[[:space:]]*= (help|note):)' "/tmp/$package.check.clean.log" | head -80)
            fi
          done
          exit "$overall"
      - name: Run affected package tests and expose errors
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          packages=(cat-eventstore-postgres cat-decision cat-affiliate cat-content cat-orchestrator cat-platform cat-prompt)
          overall=0
          for package in "${packages[@]}"; do
            echo "=== TEST $package ==="
            cargo test -p "$package" --all-targets 2>&1 | tee "/tmp/$package.test.log"
            status=${PIPESTATUS[0]}
            if [ "$status" -ne 0 ]; then
              overall=1
              summary=$(tail -n 30 "/tmp/$package.test.log" | tr '\n' ' ' | tr '\r' ' ')
              echo "::error title=$package test status::$summary"
              sed -E 's/\x1B\[[0-9;]*[[:alpha:]]//g' "/tmp/$package.test.log" > "/tmp/$package.test.clean.log"
              while IFS= read -r line; do
                [ -n "$line" ] && echo "::error title=$package test::$line"
              done < <(grep -E '^(error(\[[A-Z0-9]+\])?:|[[:space:]]*--> |[[:space:]]*= (help|note):|[[:space:]]*----)' "/tmp/$package.test.clean.log" | head -100)
            fi
          done
          exit "$overall"
      - name: Upload diagnostic logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: rust-diagnostic-logs
          path: /tmp/*.log
          if-no-files-found: error
          retention-days: 1
