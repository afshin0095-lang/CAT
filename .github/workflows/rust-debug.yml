name: CAT Rust Debug

on:
  push:
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - '.github/workflows/rust-debug.yml'
  pull_request:
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - '.github/workflows/rust-debug.yml'

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Run targeted diagnostics
        shell: bash
        run: |
          set +e
          run_one() {
            name="$1"; shift
            echo "=== $name ==="
            "$@" 2>&1 | tee "/tmp/$name.log"
            status=${PIPESTATUS[0]}
            sed -E 's/\x1B\[[0-9;]*[[:alpha:]]//g' "/tmp/$name.log" > "/tmp/$name.clean.log"
            if [ "$status" -ne 0 ]; then
              summary=$(tail -n 80 "/tmp/$name.clean.log" | tr '\n' ' ' | tr '\r' ' ')
              echo "::error title=$name summary::$summary"
              while IFS= read -r line; do
                [ -n "$line" ] && echo "::error title=$name::$line"
              done < <(grep -E '(error|warning| --> | = (help|note):|FAILED|panicked)' "/tmp/$name.clean.log" | tail -100)
            fi
            return "$status"
          }
          run_one fmt cargo fmt --all -- --check || true
          run_one affiliate-check cargo check -p cat-affiliate --all-targets || true
          cargo clippy -p cat-affiliate --all-targets --all-features --message-format=json -- -D warnings > /tmp/affiliate-clippy.json 2>&1
          python3 - <<'PY'
          import json
          for line in open('/tmp/affiliate-clippy.json', errors='replace'):
              try:
                  item = json.loads(line)
              except json.JSONDecodeError:
                  continue
              message = item.get('message', {})
              if message.get('level') not in {'warning', 'error'}:
                  continue
              spans = message.get('spans') or [{}]
              span = next((span for span in spans if span.get('is_primary')), spans[0])
              print(f"::error file={span.get('file_name','')} line={span.get('line_start',1)} title=affiliate-clippy::{message.get('message','').replace('\n', ' ').strip()}")
          PY
          run_one affiliate-test cargo test -p cat-affiliate --all-targets || true
          run_one affiliate-source cargo test -p cat-affiliate --lib discovery_source_health::tests::successes_keep_sources_healthy -- --nocapture || true
          run_one affiliate-canonical cargo test -p cat-affiliate --lib discovery::tests::canonical_key_ascii_limitation_is_documented_and_fail_closed -- --nocapture || true
          run_one platform-check cargo check -p cat-platform --all-targets || true
          run_one platform-test cargo test -p cat-platform --all-targets || true
