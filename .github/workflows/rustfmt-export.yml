name: Rustfmt export

on:
  workflow_dispatch:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format workspace
        run: cargo fmt --all || true
      - name: Package formatted Rust sources
        run: tar -czf rustfmt-export.tgz core --exclude='core/**/target'
      - uses: actions/upload-artifact@v4
        with:
          name: rustfmt-export
          path: rustfmt-export.tgz
