[package]
name = "cat-knowledge"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "CAT OMNISYSTEM knowledge graph primitives and derived-evidence store"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }
