[package]
name = "cat-eventstore-postgres"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "CAT PostgreSQL durable event-store adapter"

[lib]
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
cat-eventbus = { path = "../../eventbus/rust" }
cat-kernel = { path = "../../kernel/rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "json", "migrate", "macros"] }
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
