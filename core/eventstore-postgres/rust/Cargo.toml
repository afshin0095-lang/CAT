[package]
name = "cat-eventstore-postgres"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "CAT PostgreSQL durable event-store adapter"

[lib]
path = "src/lib.rs"

[dependencies]
cat-kernel = { path = "../../kernel/rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "json", "migrate"] }
thiserror = "2"
