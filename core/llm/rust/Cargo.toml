[package]
name = "cat-llm"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Provider-neutral CAT LLM contracts, routing policy, safety boundaries, and deterministic local execution"

[lib]
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
cat-kernel = { path = "../../kernel/rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }

[dev-dependencies]
serde_json = "1"
