[package]
name = "cat-runtime"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "CAT runtime lifecycle, task orchestration, health, and graceful shutdown foundation"

[lib]
path = "src/lib.rs"

[dependencies]
cat-eventbus = { path = "../../eventbus/rust" }
cat-kernel = { path = "../../kernel/rust" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time"] }
tracing = "0.1"
