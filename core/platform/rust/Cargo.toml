[package]
name = "cat-platform"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "CAT platform integration boundary and cross-core runtime composition"

[lib]
path = "src/lib.rs"

[dependencies]
cat-decision = { path = "../../decision/rust" }
cat-eventbus = { path = "../../eventbus/rust" }
cat-knowledge = { path = "../../knowledge/rust" }
cat-llm = { path = "../../llm/rust" }
cat-memory = { path = "../../memory/rust" }
cat-orchestrator = { path = "../../orchestrator/rust" }
cat-planning = { path = "../../planning/rust" }
cat-rag = { path = "../../rag/rust" }
cat-reasoning = { path = "../../reasoning/rust" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time"] }
uuid = { version = "1", features = ["v7", "serde"] }
