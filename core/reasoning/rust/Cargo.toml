[package]
name = "cat-reasoning"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "CAT deterministic reasoning contracts, evidence evaluation, and reasoning trace engine"

[lib]
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
cat-kernel = { path = "../../kernel/rust" }
cat-knowledge = { path = "../../knowledge/rust" }
cat-llm = { path = "../../llm/rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }
