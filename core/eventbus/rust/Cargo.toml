[package]
name = "cat-eventbus"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "CAT OMNISYSTEM typed event envelope and deterministic in-memory event bus"

[lib]
path = "src/lib.rs"

[dependencies]
cat-kernel = { path = "../../kernel/rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }
