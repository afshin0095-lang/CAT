[package]
name = "cat-eventbus"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "CAT OMNISYSTEM typed event envelope and deterministic in-memory event bus"

[lib]
path = "src/lib.rs"

[dependencies]
async-nats = { version = "0.50", features = ["jetstream"] }
async-trait = "0.1"
cat-kernel = { path = "../../kernel/rust" }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["time"] }
uuid = { version = "1", features = ["v7", "serde"] }
