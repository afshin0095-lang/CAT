name: CAT Rust Workspace

on:
  push:
    branches: [main]
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '.github/workflows/rust-workspace.yml'
  pull_request:
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '.github/workflows/rust-workspace.yml'

permissions:
  contents: read

concurrency:
  group: cat-rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 3

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  metadata:
    name: Workspace metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Validate Cargo metadata
        run: cargo metadata --no-deps --format-version 1

  clippy:
    name: Clippy cat-affiliate
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
      - name: Lint cat-affiliate
        run: cargo clippy -p cat-affiliate --all-targets --all-features -- -D warnings

  check:
    name: Check ${{ matrix.package }}
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package:
          - cat-kernel
          - cat-eventbus
          - cat-eventstore-postgres
          - cat-runtime
          - cat-knowledge
          - cat-memory
          - cat-llm
          - cat-reasoning
          - cat-decision
          - cat-planning
          - cat-orchestrator
          - cat-platform
          - cat-rag
          - cat-affiliate
          - cat-content
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
      - name: Check package
        run: cargo check -p ${{ matrix.package }} --all-targets

  test:
    name: Test ${{ matrix.package }}
    needs: metadata
    if: ${{ always() && needs.metadata.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cat_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CAT_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55432/cat_test
    strategy:
      fail-fast: false
      matrix:
        package:
          - cat-kernel
          - cat-eventbus
          - cat-eventstore-postgres
          - cat-runtime
          - cat-knowledge
          - cat-memory
          - cat-llm
          - cat-reasoning
          - cat-decision
          - cat-planning
          - cat-orchestrator
          - cat-platform
          - cat-rag
          - cat-affiliate
          - cat-content
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
      - name: Run package tests
        run: cargo test -p ${{ matrix.package }} --all-targets

  workspace-summary:
    name: Workspace summary
    needs: [fmt, metadata, clippy, check, test]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Report results
        run: |
          echo "fmt=${{ needs.fmt.result }}"
          echo "metadata=${{ needs.metadata.result }}"
          echo "clippy=${{ needs.clippy.result }}"
          echo "check=${{ needs.check.result }}"
          echo "test=${{ needs.test.result }}"
          if [ "${{ needs.fmt.result }}" != "success" ] || [ "${{ needs.metadata.result }}" != "success" ] || [ "${{ needs.clippy.result }}" != "success" ] || [ "${{ needs.check.result }}" != "success" ] || [ "${{ needs.test.result }}" != "success" ]; then
            echo "CAT Rust validation failed. Inspect the failing package matrix jobs above."
            exit 1
          fi
          echo "CAT Rust workspace validation passed."
