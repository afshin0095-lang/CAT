<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">CAT OMNISYSTEM architecture overview</title>
  <desc id="desc">A layered architecture diagram showing governance, intelligence, decision and execution, commerce capabilities, persistence and infrastructure, connected through events and provider adapters.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#161b2f"/></linearGradient>
    <linearGradient id="kernel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6d5dfc"/><stop offset="1" stop-color="#3b82f6"/></linearGradient>
    <linearGradient id="business" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10b981"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.28"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/></marker>
    <style>
      .title{font:700 34px Inter,Arial,sans-serif;fill:#fff}.subtitle{font:400 16px Inter,Arial,sans-serif;fill:#cbd5e1}
      .section{font:700 19px Inter,Arial,sans-serif;fill:#fff}.box{font:600 15px Inter,Arial,sans-serif;fill:#fff}.small{font:400 12px Inter,Arial,sans-serif;fill:#d1d5db}
      .layer{fill:#111827;stroke:#334155;stroke-width:2;rx:18}.node{fill:#1e293b;stroke:#475569;stroke-width:1.5;rx:12}
      .line{stroke:#94a3b8;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <text x="80" y="70" class="title">CAT OMNISYSTEM</text>
  <text x="80" y="100" class="subtitle">Commerce AI Trinity — durable, event-driven, provider-independent AI commerce operating system</text>

  <rect x="60" y="135" width="1480" height="105" class="layer" filter="url(#shadow)"/>
  <text x="85" y="168" class="section">01 · Governance & Human Authority</text>
  <rect x="85" y="185" width="250" height="38" class="node"/><text x="210" y="210" text-anchor="middle" class="box">Goals & Objectives</text>
  <rect x="365" y="185" width="250" height="38" class="node"/><text x="490" y="210" text-anchor="middle" class="box">Policies & Constraints</text>
  <rect x="645" y="185" width="250" height="38" class="node"/><text x="770" y="210" text-anchor="middle" class="box">Risk & Budget</text>
  <rect x="925" y="185" width="250" height="38" class="node"/><text x="1050" y="210" text-anchor="middle" class="box">Approval Gates</text>
  <rect x="1205" y="185" width="250" height="38" class="node"/><text x="1330" y="210" text-anchor="middle" class="box">Governance Audit</text>

  <rect x="60" y="265" width="1480" height="150" class="layer" filter="url(#shadow)"/>
  <text x="85" y="298" class="section">02 · Intelligence Plane</text>
  <rect x="85" y="315" width="190" height="65" class="node"/><text x="180" y="342" text-anchor="middle" class="box">Knowledge</text><text x="180" y="361" text-anchor="middle" class="small">facts · sources · graph</text>
  <rect x="300" y="315" width="190" height="65" class="node"/><text x="395" y="342" text-anchor="middle" class="box">Memory</text><text x="395" y="361" text-anchor="middle" class="small">episodic · semantic</text>
  <rect x="515" y="315" width="190" height="65" class="node"/><text x="610" y="342" text-anchor="middle" class="box">RAG</text><text x="610" y="361" text-anchor="middle" class="small">retrieval · context</text>
  <rect x="730" y="315" width="190" height="65" class="node"/><text x="825" y="342" text-anchor="middle" class="box">LLM Gateway</text><text x="825" y="361" text-anchor="middle" class="small">multi-provider</text>
  <rect x="945" y="315" width="190" height="65" class="node"/><text x="1040" y="342" text-anchor="middle" class="box">Reasoning</text><text x="1040" y="361" text-anchor="middle" class="small">analysis · synthesis</text>
  <rect x="1160" y="315" width="190" height="65" class="node"/><text x="1255" y="342" text-anchor="middle" class="box">Evaluation</text><text x="1255" y="361" text-anchor="middle" class="small">quality · outcome</text>

  <rect x="60" y="440" width="1480" height="145" class="layer" filter="url(#shadow)"/>
  <text x="85" y="473" class="section">03 · Decision, Planning & Durable Execution</text>
  <rect x="85" y="490" width="260" height="65" class="node" fill="url(#kernel)"/><text x="215" y="518" text-anchor="middle" class="box">Decision Engine</text><text x="215" y="538" text-anchor="middle" class="small">policy-aware selection</text>
  <rect x="375" y="490" width="260" height="65" class="node" fill="url(#kernel)"/><text x="505" y="518" text-anchor="middle" class="box">Planning Engine</text><text x="505" y="538" text-anchor="middle" class="small">goals → missions → tasks</text>
  <rect x="665" y="490" width="260" height="65" class="node" fill="url(#kernel)"/><text x="795" y="518" text-anchor="middle" class="box">Durable Orchestrator</text><text x="795" y="538" text-anchor="middle" class="small">state · retry · recovery</text>
  <rect x="955" y="490" width="260" height="65" class="node" fill="url(#kernel)"/><text x="1085" y="518" text-anchor="middle" class="box">Event Bus / Outbox</text><text x="1085" y="538" text-anchor="middle" class="small">durable asynchronous flow</text>
  <rect x="1245" y="490" width="210" height="65" class="node" fill="url(#kernel)"/><text x="1350" y="518" text-anchor="middle" class="box">Workers</text><text x="1350" y="538" text-anchor="middle" class="small">side-effect boundary</text>

  <rect x="60" y="610" width="1480" height="150" class="layer" filter="url(#shadow)"/>
  <text x="85" y="643" class="section">04 · Commerce Capability Plane</text>
  <rect x="85" y="660" width="200" height="65" class="node" fill="url(#business)"/><text x="185" y="688" text-anchor="middle" class="box">Affiliate Engine</text><text x="185" y="708" text-anchor="middle" class="small">discover · score · manage</text>
  <rect x="310" y="660" width="200" height="65" class="node" fill="url(#business)"/><text x="410" y="688" text-anchor="middle" class="box">Content Factory</text><text x="410" y="708" text-anchor="middle" class="small">research · create · edit</text>
  <rect x="535" y="660" width="200" height="65" class="node" fill="url(#business)"/><text x="635" y="688" text-anchor="middle" class="box">Distribution</text><text x="635" y="708" text-anchor="middle" class="small">schedule · publish</text>
  <rect x="760" y="660" width="200" height="65" class="node" fill="url(#business)"/><text x="860" y="688" text-anchor="middle" class="box">Advertising OS</text><text x="860" y="708" text-anchor="middle" class="small">campaign · budget · test</text>
  <rect x="985" y="660" width="200" height="65" class="node" fill="url(#business)"/><text x="1085" y="688" text-anchor="middle" class="box">Tracking & Attribution</text><text x="1085" y="708" text-anchor="middle" class="small">events · conversion · ROI</text>
  <rect x="1210" y="660" width="245" height="65" class="node" fill="url(#business)"/><text x="1332" y="688" text-anchor="middle" class="box">Revenue Intelligence</text><text x="1332" y="708" text-anchor="middle" class="small">profit · portfolio · learning</text>

  <rect x="60" y="785" width="1480" height="120" class="layer" filter="url(#shadow)"/>
  <text x="85" y="818" class="section">05 · Durable Truth & Infrastructure</text>
  <rect x="85" y="835" width="250" height="45" class="node"/><text x="210" y="863" text-anchor="middle" class="box">PostgreSQL / Event Store</text>
  <rect x="365" y="835" width="250" height="45" class="node"/><text x="490" y="863" text-anchor="middle" class="box">Cache / Derived State</text>
  <rect x="645" y="835" width="250" height="45" class="node"/><text x="770" y="863" text-anchor="middle" class="box">Object / Vector / Graph Stores</text>
  <rect x="925" y="835" width="250" height="45" class="node"/><text x="1050" y="863" text-anchor="middle" class="box">Metrics / Logs / Traces</text>
  <rect x="1205" y="835" width="250" height="45" class="node"/><text x="1330" y="863" text-anchor="middle" class="box">Docker / Kubernetes</text>

  <path d="M770 240 L770 265" class="line"/>
  <path d="M770 415 L770 440" class="line"/>
  <path d="M770 585 L770 610" class="line"/>
  <path d="M770 760 L770 785" class="line"/>
  <text x="1540" y="955" text-anchor="end" class="small">Conceptual target architecture · implementation status is defined by code, tests and contracts</text>
</svg>